# Conventional Commits 1.0.0 and Conventional Branch 1.1.0. See CONTRIBUTING.md.

[commit]
# message_pattern replaces commit-check's generated regex, which has no scope allowlist.
# Types are the spec's set; scopes are the workspace members plus design, examples, workspace.
message_pattern = '^(feat|fix|docs|build|ci|test|refactor|perf|style|chore|revert)(\((core|protocols|interfaces|impls|check|cli|backends|examples|design|workspace)\))?!?: [^A-Z\s].*[^.\s](\n|$)'
subject_capitalized = false
subject_imperative = true
subject_max_length = 80
allow_merge_commits = false
allow_fixup_commits = false
allow_wip_commits = false
ai_attribution = "forbid"

[branch]
conventional_branch = true
allow_branch_types = ["feature", "feat", "bugfix", "fix", "hotfix", "release", "chore"]
require_rebase_target = "origin/main"
