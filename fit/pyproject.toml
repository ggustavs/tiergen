[project]
name = "tiergen-fit"
version = "0.0.1"
description = "The fit: a run's sensor events, read through a vocabulary, into the observable chain of each behaviour, its dwells and its rate curve, as resources."
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
dependencies = ["tiergen-core", "tiergen-protocols", "tiergen-stats", "numpy>=2.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tiergen"]
