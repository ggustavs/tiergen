name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv sync --locked
      - run: uv run pyright

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - name: Agent hosts need the daemon's user-namespace remap (design decision 4.19)
        run: |
          echo '{"userns-remap": "default"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info --format '{{.SecurityOptions}}' | grep -q name=userns
      - name: dumpcap for the capture tests
        # The runner's own apt may hold the lock; wait for it a bounded time, and answer the
        # package's one question up front so nothing waits on a prompt.
        run: |
          echo "wireshark-common wireshark-common/install-setuid boolean false" | sudo debconf-set-selections
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=180 install -y -qq wireshark-common >/dev/null
          sudo chmod 755 /usr/bin/dumpcap
          sudo setcap cap_net_raw,cap_net_admin=eip /usr/bin/dumpcap
          dumpcap --version | head -1
      - run: uv run pytest
      - name: The installed command checks the examples
        run: |
          uv run tiergen check examples/hq_lan/scenario.py
          uv run tiergen check examples/hq_lan_capgap/scenario.py
          uv run tiergen build examples/linux_slice/scenario.py --out "$RUNNER_TEMP/run1"
          uv run tiergen check "$RUNNER_TEMP/run1/scenario.json"
          if uv run tiergen check examples/hq_lan_broken/scenario.py; then
            echo "hq_lan_broken passed the checks; it must fail" >&2
            exit 1
          fi
          uv run tiergen impls list

  # core, protocols, check and interfaces claim to run anywhere (design doc, section 18).
  # A separate job, not a matrix axis: an os axis would rename test (3.12) and test (3.14),
  # which the ruleset on main requires by name.
  test-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run pytest
      - name: The installed command checks the examples
        run: |
          uv run tiergen check examples/hq_lan/scenario.py
          if uv run tiergen check examples/hq_lan_broken/scenario.py; then
            echo "hq_lan_broken passed the checks; it must fail" >&2
            exit 1
          fi

  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv lock --check
      - run: uv run --frozen python scripts/check_stubs.py

  integration:
    # The Docker backend against a real daemon. Not required on main until it has been stable.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv sync --locked
      - name: Agent hosts need the daemon's user-namespace remap (design decision 4.19)
        run: |
          echo '{"userns-remap": "default"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info --format '{{.SecurityOptions}}' | grep -q name=userns
      - name: dumpcap for the capture tests
        # The runner's own apt may hold the lock; wait for it a bounded time, and answer the
        # package's one question up front so nothing waits on a prompt.
        run: |
          echo "wireshark-common wireshark-common/install-setuid boolean false" | sudo debconf-set-selections
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=180 install -y -qq wireshark-common >/dev/null
          sudo chmod 755 /usr/bin/dumpcap
          sudo setcap cap_net_raw,cap_net_admin=eip /usr/bin/dumpcap
          dumpcap --version | head -1
      - run: uv run pytest -q -m docker backends/infra/docker/tests/test_integration.py
      - name: Nothing left behind
        run: test -z "$(docker ps -aq --filter label=tiergen.run)"

  conventions:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      HEAD_REF: ${{ github.head_ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv sync --locked
      # Checkout leaves HEAD detached; commit-check reads the branch name from git.
      - run: git switch -c "$HEAD_REF"
      - name: Branch name and rebase on main
        run: uv run commit-check --branch
      - name: Every commit in the pull request
        run: |
          status=0
          for rev in $(git rev-list --reverse origin/main..HEAD); do
            uv run commit-check --compact --message --rev "$rev" || status=1
          done
          exit $status
