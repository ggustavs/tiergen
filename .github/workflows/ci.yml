name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv sync --locked
      - run: uv run pyright

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest
      - name: The installed command checks the examples
        run: |
          uv run tiergen check examples/hq_lan/scenario.py
          uv run tiergen check examples/hq_lan_capgap/scenario.py
          if uv run tiergen check examples/hq_lan_broken/scenario.py; then
            echo "hq_lan_broken passed the checks; it must fail" >&2
            exit 1
          fi
          uv run tiergen impls list

  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv lock --check

  conventions:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      HEAD_REF: ${{ github.head_ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv sync --locked
      # Checkout leaves HEAD detached; commit-check reads the branch name from git.
      - run: git switch -c "$HEAD_REF"
      - name: Branch name and rebase on main
        run: uv run commit-check --branch
      - name: Every commit in the pull request
        run: |
          status=0
          for rev in $(git rev-list --reverse origin/main..HEAD); do
            uv run commit-check --compact --message --rev "$rev" || status=1
          done
          exit $status
