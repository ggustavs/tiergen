[project]
name = "tiergen-impl-nginx"
version = "0.0.1"
description = "HTTP and HTTPS service through nginx."
requires-python = ">=3.12"
dependencies = ["tiergen-impls-base"]

[project.entry-points."tiergen.impls"]
"http.nginx" = "tiergen.impls.nginx:DESCRIPTOR"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tiergen"]
