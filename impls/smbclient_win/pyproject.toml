[project]
name = "tiergen-impl-smbclient-win"
version = "0.0.1"
description = "SMB and Kerberos client primitives through the native Windows stack."
requires-python = ">=3.12"
dependencies = ["tiergen-impls-base"]

[project.entry-points."tiergen.impls"]
"smb.windows_native" = "tiergen.impls.smbclient_win:DESCRIPTOR"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tiergen"]
