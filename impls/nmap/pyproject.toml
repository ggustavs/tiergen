[project]
name = "tiergen-impl-nmap"
version = "0.0.1"
description = "Port scans through nmap."
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
dependencies = ["tiergen-impls-base"]

[project.entry-points."tiergen.impls"]
"scan.nmap" = "tiergen.impls.nmap:DESCRIPTOR"

[project.entry-points."tiergen.impls.runtimes"]
"scan.nmap" = "tiergen.impls.nmap.runtime:NmapRuntime"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tiergen"]
