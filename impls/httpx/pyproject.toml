[project]
name = "tiergen-impl-httpx"
version = "0.0.1"
description = "HTTP client primitives through the httpx library."
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
dependencies = ["tiergen-impls-base", "httpx>=0.28,<1"]

[project.entry-points."tiergen.impls"]
"http.httpx" = "tiergen.impls.httpx:DESCRIPTOR"

[project.entry-points."tiergen.impls.runtimes"]
"http.httpx" = "tiergen.impls.httpx.runtime:HttpxRuntime"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tiergen"]
