[project]
name = "tiergen-impl-httpx"
version = "0.0.1"
description = "HTTP client primitives through the httpx library."
requires-python = ">=3.12"
dependencies = ["tiergen-impls-base"]

[project.entry-points."tiergen.impls"]
"http.httpx" = "tiergen.impls.httpx:DESCRIPTOR"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tiergen"]
