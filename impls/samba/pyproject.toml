[project]
name = "tiergen-impl-samba"
version = "0.0.1"
description = "SMB file service through Samba."
requires-python = ">=3.12"
dependencies = ["tiergen-impls-base"]

[project.entry-points."tiergen.impls"]
"smb.samba" = "tiergen.impls.samba:DESCRIPTOR"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tiergen"]
