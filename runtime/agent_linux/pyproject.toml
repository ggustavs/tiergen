[project]
name = "tiergen-agent-linux"
version = "0.0.1"
description = "The Linux agent: runs one instance's program inside its host."
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
dependencies = ["tiergen-core", "tiergen-impls-base"]

[project.scripts]
tiergen-agent = "tiergen.runtime.agent_linux.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tiergen"]
