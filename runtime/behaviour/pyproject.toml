[project]
name = "tiergen-behaviour"
version = "0.0.1"
description = "The behaviour loop: an instance's semi-Markov processes run against a clock, on any platform or none."
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
dependencies = ["tiergen-core", "tiergen-impls-base"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tiergen"]
