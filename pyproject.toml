[project]
name = "tiergen-workspace"
version = "0.0.0"
description = "Workspace root for tiergen. Not a package; see the members."
requires-python = ">=3.12"
dependencies = [
    "tiergen-core",
    "tiergen-protocols",
    "tiergen-interfaces",
    "tiergen-impls-base",
    "tiergen-check",
    "tiergen-cli",
    "tiergen-sensor-zeek",
    "tiergen-sensor-suricata",
    "tiergen-infra-base",
    "tiergen-infra-docker",
    "tiergen-infra-libvirt",
    "tiergen-impl-httpx",
    "tiergen-impl-nmap",
    "tiergen-impl-nginx",
    "tiergen-impl-samba",
    "tiergen-impl-smbclient-win",
]

[dependency-groups]
dev = [
    "commit-check",
    "hypothesis",
    "pre-commit",
    "pyright",
    "pytest",
    "ruff",
    "types-docker",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "core",
    "protocols",
    "interfaces",
    "impls/*",
    "backends/sensor/*",
    "backends/infra/*",
    "check",
    "cli",
]

[tool.uv.sources]
tiergen-core = { workspace = true }
tiergen-protocols = { workspace = true }
tiergen-interfaces = { workspace = true }
tiergen-impls-base = { workspace = true }
tiergen-check = { workspace = true }
tiergen-cli = { workspace = true }
tiergen-sensor-zeek = { workspace = true }
tiergen-sensor-suricata = { workspace = true }
tiergen-infra-base = { workspace = true }
tiergen-infra-docker = { workspace = true }
tiergen-infra-libvirt = { workspace = true }
tiergen-impl-httpx = { workspace = true }
tiergen-impl-nmap = { workspace = true }
tiergen-impl-nginx = { workspace = true }
tiergen-impl-samba = { workspace = true }
tiergen-impl-smbclient-win = { workspace = true }

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
extraPaths = ["check/tests"]
include = ["core", "protocols", "interfaces", "impls", "backends", "check", "cli", "examples"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = [
    "core",
    "protocols",
    "interfaces",
    "impls/_base",
    "impls/httpx",
    "impls/nmap",
    "impls/nginx",
    "impls/samba",
    "impls/smbclient_win",
    "backends/sensor/zeek",
    "backends/sensor/suricata",
    "backends/infra/_base",
    "backends/infra/docker",
    "backends/infra/libvirt",
    "check",
    "cli",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "PT", "SIM", "RUF"]

[tool.ruff.format]
# The design doc's Python blocks are sketches, laid out by hand.
exclude = ["*.md"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
markers = ["docker: needs a reachable Docker daemon; skipped otherwise"]
# check/tests/support.py is shared by the per-check test modules.
pythonpath = ["check/tests"]
testpaths = [
    "core/tests",
    "protocols/tests",
    "interfaces/tests",
    "impls/_base/tests",
    "impls/httpx/tests",
    "impls/nmap/tests",
    "impls/nginx/tests",
    "impls/samba/tests",
    "impls/smbclient_win/tests",
    "backends/sensor/zeek/tests",
    "backends/sensor/suricata/tests",
    "backends/infra/_base/tests",
    "backends/infra/docker/tests",
    "backends/infra/libvirt/tests",
    "check/tests",
    "cli/tests",
    "examples/tests",
]
