[project]
name = "tiergen-workspace"
version = "0.0.0"
description = "Workspace root for tiergen. Not a package; see the members."
requires-python = ">=3.12"
dependencies = [
    "tiergen-core",
    "tiergen-protocols",
    "tiergen-interfaces",
    "tiergen-impls-base",
    "tiergen-check",
    "tiergen-cli",
    "tiergen-sensor-zeek",
    "tiergen-sensor-suricata",
]

[dependency-groups]
dev = [
    "commit-check",
    "hypothesis",
    "pre-commit",
    "pyright",
    "pytest",
    "ruff",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["core", "protocols", "interfaces", "impls/*", "backends/sensor/*", "check", "cli"]

[tool.uv.sources]
tiergen-core = { workspace = true }
tiergen-protocols = { workspace = true }
tiergen-interfaces = { workspace = true }
tiergen-impls-base = { workspace = true }
tiergen-check = { workspace = true }
tiergen-cli = { workspace = true }
tiergen-sensor-zeek = { workspace = true }
tiergen-sensor-suricata = { workspace = true }

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["core", "protocols", "interfaces", "impls", "backends", "check", "cli"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = [
    "core",
    "protocols",
    "interfaces",
    "impls/_base",
    "backends/sensor/zeek",
    "backends/sensor/suricata",
    "check",
    "cli",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "PT", "SIM", "RUF"]

[tool.ruff.format]
# The design doc's Python blocks are sketches, laid out by hand.
exclude = ["*.md"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = [
    "core/tests",
    "protocols/tests",
    "interfaces/tests",
    "impls/_base/tests",
    "backends/sensor/zeek/tests",
    "backends/sensor/suricata/tests",
    "check/tests",
    "cli/tests",
]
