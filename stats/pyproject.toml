[project]
name = "tiergen-stats"
version = "0.0.1"
description = "Estimators with intervals, two-sample tests on event streams, and their calibration on the simulator."
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
dependencies = ["tiergen-core", "tiergen-sim", "numpy>=2.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tiergen"]
