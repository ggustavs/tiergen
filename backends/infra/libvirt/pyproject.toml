[project]
name = "tiergen-infra-libvirt"
version = "0.0.1"
description = "libvirt: Linux and Windows virtual machines under KVM."
requires-python = ">=3.12"
dependencies = ["tiergen-interfaces"]

[project.entry-points."tiergen.infra"]
libvirt = "tiergen.backends.infra.libvirt:DESCRIPTOR"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tiergen"]
