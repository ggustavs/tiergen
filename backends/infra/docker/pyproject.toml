[project]
name = "tiergen-infra-docker"
version = "0.0.1"
description = "Docker: Linux containers on the local Linux daemon."
requires-python = ">=3.12"
dependencies = ["tiergen-interfaces"]

[project.entry-points."tiergen.infra"]
docker = "tiergen.backends.infra.docker:DESCRIPTOR"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tiergen"]
