[project]
name = "tiergen-sensor-suricata"
version = "0.0.1"
description = "Suricata: eve.json flow records as the required core, app-layer events as APP_EVENTS."
requires-python = ">=3.12"
dependencies = ["tiergen-interfaces"]

[project.entry-points."tiergen.sensors"]
suricata = "tiergen.backends.sensor.suricata:DESCRIPTOR"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tiergen"]
