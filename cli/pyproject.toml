[project]
name = "tiergen-cli"
version = "0.0.1"
description = "The tiergen command line."
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
dependencies = ["tiergen-check", "tiergen-impls-base", "tiergen-infra-base", "tiergen-capture", "tiergen-attrib-linux-ebpf", "tiergen-sensor-base", "tiergen-sensor-zeek", "tiergen-sensor-suricata", "tiergen-scheduler", "tiergen-assemble"]

[project.scripts]
tiergen = "tiergen.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tiergen"]
