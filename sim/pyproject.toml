[project]
name = "tiergen-sim"
version = "0.0.1"
description = "The simulator: a scenario's behaviours run under a fake clock, its invocations turned into the events a sensor would report."
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
dependencies = ["tiergen-core", "tiergen-protocols", "tiergen-behaviour"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tiergen"]
